[package]
name = "agent-protocol-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
